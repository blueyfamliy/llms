<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLMS Studio</title>
<style>
  :root {
    --bg: #0f1020; --panel: #181a30; --panel-2: #1f2140; --line: #2c2f52;
    --text: #e8e9f5; --muted: #9a9cc0; --accent: #7c5cff; --accent-2: #22d3ee;
    --ok: #34d399; --bad: #f87171; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    height: 100vh; display: grid; grid-template-columns: 290px 1fr;
  }
  aside {
    background: var(--panel); border-right: 1px solid var(--line);
    padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px;
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand .mark {
    width: 34px; height: 34px; border-radius: 9px; flex: none;
    background: linear-gradient(160deg, #312e81, #6d28d9);
    display: grid; align-content: center; gap: 3px; padding: 8px 7px;
  }
  .brand .mark i { display: block; height: 3px; border-radius: 2px; background: #fff; }
  .brand .mark i:nth-child(1) { width: 100%; }
  .brand .mark i:nth-child(2) { width: 78%; }
  .brand .mark i:nth-child(3) { width: 56%; }
  .brand h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  .brand p { margin: 1px 0 0; font-size: 11px; color: var(--muted); }

  label { display: block; font-size: 11px; text-transform: uppercase;
          letter-spacing: .07em; color: var(--muted); margin-bottom: 6px; }
  select, input, textarea {
    width: 100%; padding: 9px 10px; border-radius: 8px; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--line); font: inherit;
  }
  textarea { resize: vertical; min-height: 64px; }
  select:focus, input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  button {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid transparent;
    background: var(--panel-2); color: var(--text); font: inherit; font-weight: 550;
    cursor: pointer; transition: filter .12s, opacity .12s;
  }
  button:hover:not(:disabled) { filter: brightness(1.22); }
  button:disabled { opacity: .38; cursor: not-allowed; }
  button.primary { background: linear-gradient(160deg, #6d28d9, #4c1d95); }
  button.danger  { background: #7f1d1d; }
  button.ghost   { background: transparent; border-color: var(--line); color: var(--muted); }

  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .group { display: flex; flex-direction: column; gap: 10px; }
  .divider { height: 1px; background: var(--line); }

  main { display: flex; flex-direction: column; min-width: 0; }
  header {
    padding: 16px 22px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .status { display: flex; align-items: center; gap: 9px; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.busy { background: var(--accent-2); animation: pulse 1.1s ease-in-out infinite; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  .ws { font-size: 11px; color: var(--muted); font-family: ui-monospace, Menlo, monospace;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #log {
    flex: 1; margin: 0; padding: 16px 22px; overflow: auto; white-space: pre-wrap;
    word-break: break-word; font: 12.5px/1.6 ui-monospace, Menlo, Consolas, monospace;
    color: #cdd0ea;
  }
  #log:empty::after { content: "No output yet. Pick a config and start a run."; color: var(--muted); }
  .hint { font-size: 11px; color: var(--muted); margin: 0; }
  .err { color: var(--bad); }
</style>
</head>
<body>
<aside>
  <div class="brand">
    <div class="mark"><i></i><i></i><i></i></div>
    <div><h1>LLMS Studio</h1><p>Language model training</p></div>
  </div>

  <div class="group">
    <div>
      <label for="config">Configuration</label>
      <select id="config"></select>
    </div>
    <button id="train" class="primary">Start Training</button>
  </div>

  <div class="divider"></div>

  <div class="group">
    <div>
      <label for="ckpt">Checkpoint</label>
      <select id="ckpt"></select>
    </div>
    <div>
      <label for="prompt">Prompt</label>
      <input id="prompt" placeholder="text to continue">
    </div>
    <div class="row">
      <div><label for="tokens">Tokens</label><input id="tokens" type="number" value="200" min="1" max="4096"></div>
      <div><label for="temp">Temp</label><input id="temp" type="number" value="0.8" min="0" max="2" step="0.1"></div>
    </div>
    <button id="sample">Start Sampling</button>
  </div>

  <div class="divider"></div>

  <div class="group">
    <label for="kovi">Kovi AI Customization</label>
    <textarea id="kovi" placeholder="e.g. make it smaller and faster"></textarea>
    <button id="suggest" class="ghost">Get Suggestions</button>
    <p class="hint" id="overrides"></p>
  </div>

  <div style="margin-top:auto" class="group">
    <button id="stop" class="danger" disabled>Stop</button>
  </div>
</aside>

<main>
  <header>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Ready</span></div>
    <div class="ws" id="workspace"></div>
  </header>
  <pre id="log"></pre>
</main>

<script>
const $ = id => document.getElementById(id);
const log = $("log");

function atBottom() {
  return log.scrollTop + log.clientHeight >= log.scrollHeight - 40;
}
function append(text) {
  const stick = atBottom();
  log.textContent += text;
  if (stick) log.scrollTop = log.scrollHeight;
}
function setStatus(status, busy) {
  $("status").textContent = status;
  const dot = $("dot");
  dot.className = "dot" + (busy ? " busy" : /fail/i.test(status) ? " bad"
                                 : /done/i.test(status) ? " ok" : "");
  $("train").disabled = busy || !$("config").value;
  $("sample").disabled = busy || !$("ckpt").value;
  $("stop").disabled = !busy;
}
function fill(select, values, emptyLabel) {
  const previous = select.value;
  select.innerHTML = "";
  if (!values.length) {
    select.append(new Option(emptyLabel, ""));
    select.disabled = true;
    return;
  }
  select.disabled = false;
  for (const v of values) select.append(new Option(v, v));
  if (values.includes(previous)) select.value = previous;
}

async function post(path, body) {
  const r = await fetch(path, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {})
  });
  const data = await r.json();
  if (data.ok === false) append("\n" + data.error + "\n");
  return data;
}

async function refresh() {
  const s = await (await fetch("/api/state")).json();
  $("workspace").textContent = s.workspace;
  $("workspace").title = s.workspace;
  fill($("config"), s.configs, "no configs found");
  fill($("ckpt"), s.checkpoints, "train a model first");
  if (log.textContent === "") log.textContent = s.log;
  log.scrollTop = log.scrollHeight;
  setStatus(s.status, s.busy);
}

$("train").onclick  = () => post("/api/train",  { config: $("config").value });
$("sample").onclick = () => post("/api/sample", {
  checkpoint: $("ckpt").value,
  prompt: $("prompt").value,
  max_new_tokens: Number($("tokens").value) || 200,
  temperature: Number($("temp").value),
});
$("stop").onclick = () => post("/api/stop");
$("suggest").onclick = async () => {
  const data = await post("/api/customize", { prompt: $("kovi").value });
  const pairs = Object.entries(data.overrides || {});
  $("overrides").textContent = pairs.length
    ? "Applied: " + pairs.map(([k, v]) => `${k}=${v}`).join(", ")
    : "No overrides.";
  append("\n" + data.response + "\n");
};
$("config").onchange = $("ckpt").onchange = () => setStatus($("status").textContent, false);

// Live log over server-sent events; refresh the dropdowns when a run finishes
// so a newly written checkpoint shows up without a reload.
let wasBusy = false;
const events = new EventSource("/api/stream");
events.onmessage = e => {
  const d = JSON.parse(e.data);
  if (d.lines) append(d.lines);
  setStatus(d.status, d.busy);
  if (wasBusy && !d.busy) refresh();
  wasBusy = d.busy;
};

refresh();
</script>
</body>
</html>
