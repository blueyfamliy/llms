[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llms"
version = "0.1.0"
description = "Train a decoder-only language model from scratch: BPE tokenizer, transformer, training loop, sampling."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "regex>=2023.10.3",
]

[project.optional-dependencies]
# The desktop app serves its UI over local HTTP; see gui/server.py.
gui = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=7.4", "ruff>=0.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["llms*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
